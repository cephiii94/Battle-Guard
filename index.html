<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA -->
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Battle Guard" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Battle Guard</title>
    <script>
      window.addEventListener('error', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.background = 'rgba(0,0,0,0.9)';
        errDiv.style.color = '#ff6b6b';
        errDiv.style.zIndex = '10000';
        errDiv.style.padding = '20px';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.fontSize = '14px';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerText = 'Error: ' + e.message + '\nAt: ' + e.filename + ':' + e.lineno + '\n\nStack:\n' + (e.error ? e.error.stack : '');
        document.body.appendChild(errDiv);
      });
    </script>
  </head>
  <body>
    <!-- Portrait rotate notice -->
    <div id="rotate-notice">
      <div class="rotate-notice-inner">
        <div class="rotate-icon">&#8635;</div>
        <p class="rotate-title">Putar Perangkat</p>
        <p class="rotate-subtitle">Battle Guard dimainkan dalam mode <strong>landscape</strong></p>
      </div>
    </div>
    <div id="game-container">
      <div id="game"></div>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
